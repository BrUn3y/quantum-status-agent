[project]
name = "quantum-status-agent"
version = "1.0.0"
description = "Quantum Status Agent - Specialist in querying IBM Quantum backend status and job results"
readme = "README.md"
authors = [{ name = "Edgar Bruney" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "agentstack-sdk==0.4.0rc1",
    "beeai_framework>=0.1.76",
    "qiskit>=1.0.0",
    "qiskit-ibm-runtime>=0.20.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.7.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[project.scripts]
server = "quantum_status_agent.agent:run"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_status_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"